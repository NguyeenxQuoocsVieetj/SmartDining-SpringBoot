spring.application.name=SmartDining
server.port=8080

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# devtools bật log này mặc định; lỗi validation sẽ ghi cả mật khẩu bị từ chối ra log
spring.mvc.log-resolved-exception=false
# Từ chối 1.5 cho trường số nguyên và số thứ tự thay cho tên enum
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true

# Đăng nhập. Khóa ký JWT lấy từ biến JWT_SECRET (ít nhất 32 byte); bỏ trống thì sinh ngẫu nhiên
# mỗi lần chạy, nên khởi động lại là mọi người phải đăng nhập lại
smartdining.security.jwt-secret=${JWT_SECRET:}
smartdining.security.access-ttl=15m
smartdining.security.session-ttl=8h
# Chặn dò mật khẩu
smartdining.security.login.max-failures-per-username=5
smartdining.security.login.max-failures-per-ip=20
smartdining.security.login.window=15m
smartdining.security.login.lock=15m
# Không tin X-Forwarded-For: địa chỉ client là địa chỉ kết nối thật
server.forward-headers-strategy=none

# Thời hạn phiên khách quét QR tại bàn
smartdining.table-session.ttl=12h
# Đường dẫn in trong QR của bàn: giá trị này nối thêm mã của bàn
smartdining.qr.base-url=http://localhost:8080/?qr=

# Mã vào quầy: thời hạn, thời gian chờ gửi lại, số lần nhập sai thì hủy mã
smartdining.counter-code.ttl=5m
smartdining.counter-code.resend-delay=60s
smartdining.counter-code.max-attempts=5

# Hai lịch đặt đã xác nhận cùng một bàn phải có giờ đến cách nhau ít nhất khoảng này
smartdining.reservation.table-gap=2h

# Ảnh bill chuyển khoản: nơi lưu và giới hạn tải lên (ứng dụng chỉ nhận ảnh tối đa 3MB)
smartdining.payment-proof.dir=./data
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Cho Tomcat đọc bỏ phần dư của request quá lớn để client nhận được phản hồi 413
server.tomcat.max-swallow-size=20MB

#Config Securities
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=org.springboot.smartdining.entity
# Mỗi lần đọc trả đối tượng mới từ DB, tránh service so sánh với đối tượng đã bị nơi gọi sửa
mybatis.configuration.local-cache-scope=statement
#Config SQL Logging
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show_sql=true